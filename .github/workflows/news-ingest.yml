name: Ingesta de noticias (cada 3 horas)

# Vercel Hobby solo permite cron jobs de una vez al dia (ver vercel.json), asi que esta
# ingesta mas frecuente se dispara desde GitHub Actions en vez de Vercel Cron: llama al
# mismo endpoint /api/news/ingest que ya existe, protegido por el mismo CRON_SECRET.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/news/ingest
        run: |
          curl -sf -X GET "${{ vars.APP_URL }}/api/news/ingest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
